<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Bow curved limb (Robin Hood green) -->
  <path d="M10 4 C22 9, 22 23, 10 28" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  <!-- Bow grip / riser -->
  <path d="M18.8 13.5 C19.2 15, 19.2 17, 18.8 18.5" stroke="#15803d" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Bowstring drawn back -->
  <path d="M10 4 L4 16 L10 28" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow shaft (Golden wood) -->
  <line x1="4" y1="16" x2="27" y2="16" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Arrowhead (Sharp golden tip pointed forward) -->
  <path d="M22 11.5 L29 16 L22 20.5 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Arrow fletching feathers (Robin green) -->
  <path d="M5 13 L7.5 16 L5 19" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8 13.5 L10.5 16 L8 18.5" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
